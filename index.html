<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ViralFit News</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#222;
}

/* HEADER */

header{
  background:#fff;
  padding:16px 22px;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:999;
}

.logo{
  font-size:28px;
  font-weight:bold;
}

/* NAVBAR */

.navbar{
  background:#fff;
  padding:12px 22px;
  border-bottom:1px solid #eee;
  display:flex;
  gap:22px;
  overflow:auto;
}

.navbar a{
  text-decoration:none;
  color:#222;
  font-weight:bold;
  white-space:nowrap;
  transition:.2s;
}

.navbar a:hover{
  color:#d00000;
}

/* BREAKING */

.breaking{
  background:#d00000;
  color:#fff;
  display:flex;
  align-items:center;
  padding:10px 15px;
  overflow:hidden;
  font-weight:bold;
}

.breaking-label{
  margin-right:10px;
  white-space:nowrap;
}

.marquee{
  overflow:hidden;
  white-space:nowrap;
  flex:1;
}

.marquee span{
  display:inline-block;
  padding-left:100%;
  animation:marquee 18s linear infinite;
}

@keyframes marquee{

  0%{
    transform:translateX(0);
  }

  100%{
    transform:translateX(-100%);
  }

}

/* CONTAINER */

.container{
  max-width:1280px;
  margin:auto;
  padding:20px;
}

/* TOP GRID */

.top-grid{
  display:grid;
  grid-template-columns:1.4fr 1fr;
  gap:20px;
  margin-bottom:25px;
}

/* HERO */

.hero{
  position:relative;
  border-radius:20px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
  transition:.25s;
}

.hero:hover{
  transform:translateY(-4px);
}

.hero img{
  width:100%;
  height:380px;
  object-fit:cover;
}

.hero::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(0,0,0,.5),
    transparent
  );
}

.hero-content{
  position:absolute;
  bottom:0;
  left:0;
  z-index:2;
  padding:28px;
  color:#fff;
}

.hero-title{
  font-size:34px;
  line-height:1.3;
  font-weight:bold;
  margin-bottom:10px;
}

/* SIDE */

.side-news{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.small-card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  display:flex;
  gap:12px;
  padding:10px;
  align-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
  transition:.25s;
}

.small-card:hover{
  transform:translateY(-4px);
}

.small-card img{
  width:120px;
  height:90px;
  object-fit:cover;
  border-radius:12px;
}

.small-content{
  flex:1;
}

.small-content b{
  font-size:14px;
  line-height:1.5;
}

/* BOTTOM */

.bottom-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.05);
  transition:.25s;
}

.card:hover{
  transform:translateY(-4px);
}

.card img{
  width:100%;
  height:190px;
  object-fit:cover;
}

.card-content{
  padding:16px;
}

.title{
  font-size:18px;
  font-weight:bold;
  line-height:1.4;
  margin-bottom:8px;
}

.card-content p{
  color:#666;
  line-height:1.6;
  font-size:14px;
}

/* LINKS */

a{
  text-decoration:none;
  color:inherit;
}

/* MOBILE */

@media(max-width:768px){

  .top-grid{
    grid-template-columns:1fr;
  }

  .hero img{
    height:260px;
  }

  .hero-title{
    font-size:24px;
  }

  .small-card{
    flex-direction:column;
    align-items:flex-start;
  }

  .small-card img{
    width:100%;
    height:180px;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">
    🔥 ViralFit News
  </div>

</header>

<nav class="navbar">

  <a href="#">AI</a>
  <a href="#">Technology</a>
  <a href="#">Viral</a>
  <a href="#">Shorts</a>
  <a href="#">TikTok</a>

</nav>

<div class="breaking">

  <div class="breaking-label">
    🔴 BREAKING
  </div>

  <div class="marquee">

    <span id="breakingText">
      Loading...
    </span>

  </div>

</div>

<div class="container">

  <div class="top-grid">

    <div id="hero"></div>

    <div id="sideNews" class="side-news"></div>

  </div>

  <div id="bottomNews" class="bottom-grid"></div>

</div>

<script>

const API =
"https://raw.githubusercontent.com/viralfit/viral-news/main/news.json";

async function loadNews(){

  try{

    const res = await fetch(API);

    const data = await res.json();

    document.getElementById("breakingText")
      .innerHTML = data.breaking.join(" • ");

    const posts = data.posts;

    // HERO

    document.getElementById("hero").innerHTML = `
    
    <a href="${posts[0].url}" target="_blank">

      <div class="hero">

        <img src="${posts[0].image}">

        <div class="hero-content">

          <div style="
            font-size:12px;
            margin-bottom:8px;
            font-weight:bold;
          ">
            🔥 HEADLINE NEWS
          </div>

          <div class="hero-title">

            ${posts[0].title}

          </div>

          <p>

            ${posts[0].desc}

          </p>

        </div>

      </div>

    </a>
    
    `;

    // SIDE NEWS

    let sideHTML = "";

    posts.slice(1,5).forEach(item => {

      sideHTML += `
      
      <a href="${item.url}" target="_blank">

        <div class="small-card">

          <img src="${item.image}">

          <div class="small-content">

            <div style="
              font-size:11px;
              color:gray;
              margin-bottom:5px;
              font-weight:bold;
            ">
              VIRAL UPDATE
            </div>

            <b>

              ${item.title}

            </b>

          </div>

        </div>

      </a>
      
      `;

    });

    document.getElementById("sideNews")
      .innerHTML = sideHTML;

    // BOTTOM NEWS

    let bottomHTML = "";

    posts.slice(5).forEach(item => {

      bottomHTML += `
      
      <a href="${item.url}" target="_blank">

        <div class="card">

          <img src="${item.image}">

          <div class="card-content">

            <div style="
              font-size:12px;
              color:gray;
              margin-bottom:6px;
              font-weight:bold;
            ">
              🔥 TRENDING • 2026
            </div>

            <div class="title">

              ${item.title}

            </div>

            <p>

              ${item.desc}

            </p>

          </div>

        </div>

      </a>

      `;

    });

    document.getElementById("bottomNews")
      .innerHTML = bottomHTML;

  }

  catch(err){

    console.log(err);

    document.getElementById("bottomNews")
      .innerHTML = "❌ Gagal load berita";

  }

}

loadNews();

</script>

</body>
</html>
