<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViralFit News</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f1f1f1;
  color:#222;
}

/* HEADER */

header{
  background:#fff;
  padding:15px 20px;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

/* BREAKING */

.breaking{
  background:#c40000;
  color:#fff;
  display:flex;
  align-items:center;
  padding:10px 15px;
  overflow:hidden;
  font-weight:bold;
}

.breaking-label{
  margin-right:10px;
  white-space:nowrap;
}

.marquee{
  overflow:hidden;
  white-space:nowrap;
  flex:1;
}

.marquee span{
  display:inline-block;
  padding-left:100%;
  animation:marquee 18s linear infinite;
}

@keyframes marquee{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}

/* CONTAINER */

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
}

/* HERO */

.hero{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  margin-bottom:20px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.hero img{
  width:100%;
  height:350px;
  object-fit:cover;
}

.hero-content{
  padding:15px;
}

.hero-title{
  font-size:24px;
  font-weight:bold;
  margin-bottom:10px;
}

/* CARD */

.card{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  margin-bottom:20px;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
  transition:0.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
}

.card-content{
  padding:15px;
}

.title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
}

/* SIDEBAR */

.sidebar{
  background:#fff;
  border-radius:15px;
  padding:15px;
  height:fit-content;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.sidebar h3{
  margin-bottom:15px;
}

.trend{
  padding:10px 0;
  border-bottom:1px solid #eee;
}

/* LINKS */

a{
  text-decoration:none;
  color:inherit;
}

/* MOBILE */

@media(max-width:768px){

.container{
  grid-template-columns:1fr;
}

.hero img{
  height:240px;
}

.card img{
  height:200px;
}

.hero-title{
  font-size:20px;
}

}

</style>
</head>

<body>

<header>
  <div class="logo">🔥 ViralFit News</div>
</header>

<!-- BREAKING NEWS -->

<div class="breaking">
  <div class="breaking-label">🔴 BREAKING</div>

  <div class="marquee">
    <span id="breakingText">
      Loading...
    </span>
  </div>
</div>

<!-- CONTENT -->

<div class="container">

  <!-- MAIN -->

  <div>

    <div id="hero"></div>

    <div id="news"></div>

  </div>

  <!-- SIDEBAR -->

  <div class="sidebar">

    <h3>🔥 Trending</h3>

    <div class="trend">AI Viral Tools</div>
    <div class="trend">YouTube Shorts Strategy</div>
    <div class="trend">TikTok Viral Content</div>
    <div class="trend">GitHub Auto Website</div>

  </div>

</div>

<script>

const API =
"https://raw.githubusercontent.com/viralfit/viral-news/main/news.json";

async function loadNews(){

  try{

    const res = await fetch(API);

    const data = await res.json();

    // BREAKING

    document.getElementById("breakingText")
      .innerHTML = data.breaking.join(" • ");

    // POSTS

    const posts = data.posts;

    // HERO

    document.getElementById("hero").innerHTML = `
    
      <a href="${posts[0].url}" target="_blank">

        <div class="hero">

          <img src="${posts[0].image}">

          <div class="hero-content">

            <div class="hero-title">
              ${posts[0].title}
            </div>

            <p>${posts[0].desc}</p>

          </div>

        </div>

      </a>

    `;

    // LIST

    let html = "";

    posts.slice(1).forEach(item => {

      html += `
      
      <a href="${item.url}" target="_blank">

        <div class="card">

          <img src="${item.image}">

          <div class="card-content">

            <div class="title">
              ${item.title}
            </div>

            <p>${item.desc}</p>

          </div>

        </div>

      </a>

      `;

    });

    document.getElementById("news").innerHTML = html;

  }

  catch(err){

    console.log(err);

    document.getElementById("news").innerHTML =
      "❌ Gagal load data";

  }

}

loadNews();

</script>

</body>
</html>
