<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ViralFit News</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#f1f1f1;
  color:#222;
  max-width:1280px;
}

/* HEADER */

header{
  background:#fff;
  padding:15px 20px;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

/* BREAKING */

.breaking{
  background:#c40000;
  color:#fff;
  display:flex;
  align-items:center;
  padding:10px 15px;
  overflow:hidden;
  font-weight:bold;
}

.breaking-label{
  margin-right:10px;
  white-space:nowrap;
}

.marquee{
  overflow:hidden;
  white-space:nowrap;
  flex:1;
}

.marquee span{
  display:inline-block;
  padding-left:100%;
  animation:marquee 18s linear infinite;
}

@keyframes marquee{
  0%{transform:translateX(0);}
  100%{transform:translateX(-100%);}
}

/* MAIN CONTAINER */

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

/* TOP GRID */

.top-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:20px;
}

/* HERO */

.hero{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
}

.hero img{
  width:100%;
  height:340px;
  object-fit:cover;
}

.hero-content{
  padding:15px;
}

.hero-title{
  font-size:28px;
  font-weight:bold;
  margin-bottom:10px;
}

/* SIDE NEWS */

.side-news{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.small-card{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
  transition:0.2s;
}

.small-card:hover{
  transform:translateY(-3px);
}

.small-card img{
  width:100%;
  height:130px;
  object-fit:cover;
}

.small-content{
  padding:10px;
}

.small-content b{
  font-size:14px;
  line-height:1.4;
}

/* BOTTOM GRID */

.bottom-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

/* CARD */

.card{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
  transition:0.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card-content{
  padding:15px;
}

.title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
}

/* LINK */

a{
  text-decoration:none;
  color:inherit;
}

/* MOBILE */

@media(max-width:768px){

.top-grid{
  grid-template-columns:1fr;
}

.hero img{
  height:260px;
}

}

</style>
</head>

<body>

<header>
  <div class="logo">🔥 ViralFit News</div>
</header>
<nav class="navbar">
  <a href="#">AI</a>
  <a href="#">Viral</a>
  <a href="#">Shorts</a>
  <a href="#">TikTok</a>
  <a href="#">Technology</a>
</nav>
  
<!-- BREAKING NEWS -->

<div class="breaking">

  <div class="breaking-label">
    🔴 BREAKING
  </div>

  <div class="marquee">
    <span id="breakingText">
      Loading...
    </span>
  </div>

</div>

<!-- CONTENT -->

<div class="container">

  <!-- TOP -->

  <div class="top-grid">

    <div id="hero"></div>

    <div id="sideNews" class="side-news"></div>

  </div>

  <!-- BOTTOM -->

  <div id="bottomNews" class="bottom-grid"></div>

</div>

<script>

const API =
"https://raw.githubusercontent.com/viralfit/viral-news/main/news.json";

async function loadNews(){

  try{

    const res = await fetch(API);

    const data = await res.json();

    // BREAKING NEWS

    document.getElementById("breakingText")
      .innerHTML = data.breaking.join(" • ");

    const posts = data.posts;

    // HERO

    document.getElementById("hero").innerHTML = `
    
      <a href="${posts[0].url}" target="_blank">

        <div class="hero">

          <img src="${posts[0].image}">

          <div class="hero-content">

            <div class="hero-title">
              ${posts[0].title}
            </div>

            <p>${posts[0].desc}</p>

          </div>

        </div>

      </a>

    `;

    // RIGHT SMALL NEWS

    let sideHTML = "";

    posts.slice(1,5).forEach(item => {

      sideHTML += `
      
      <a href="${item.url}" target="_blank">

        <div class="small-card">

          <img src="${item.image}">

          <div class="small-content">

            <b>${item.title}</b>

          </div>

        </div>

      </a>

      `;

    });

    document.getElementById("sideNews").innerHTML = sideHTML;

    // BOTTOM NEWS

    let bottomHTML = "";

    posts.slice(5).forEach(item => {

      bottomHTML += `
      
      <a href="${item.url}" target="_blank">

        <div class="card">

          <img src="${item.image}">

          <div class="card-content">

            <div class="title">
              ${item.title}
            </div>

            <p>${item.desc}</p>

          </div>

        </div>

      </a>

      `;

    });

    document.getElementById("bottomNews").innerHTML = bottomHTML;

  }

  catch(err){

    console.log(err);

    document.getElementById("bottomNews").innerHTML =
      "❌ Gagal load data";

  }

}

loadNews();

</script>

</body>
</html>
